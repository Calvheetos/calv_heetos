<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Hi! Welcome to my Website" />
    <title>Calv Heetos</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        (function (location) {
            if (location.search.charAt(1) !== '/') return;

            var route = location.search.slice(1).split('&').map(function (part) {
                return part.replace(/~and~/g, '&');
            });

            window.history.replaceState(
                null,
                '',
                location.pathname.slice(0, -1) + route[0] +
                (route[1] ? '?' + route.slice(1).join('&') : '') +
                location.hash
            );
        }(window.location));
    </script>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
</body>

</html>
