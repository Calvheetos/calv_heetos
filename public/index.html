<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Hi! Welcome to my Website" />
    <title>Calv Heetos</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}

        var analyticsLoaded = false;

        function loadAnalytics() {
            if (analyticsLoaded) return;
            analyticsLoaded = true;

            gtag('consent', 'default', {
                analytics_storage: 'granted',
                ad_storage: 'denied',
                ad_user_data: 'denied',
                ad_personalization: 'denied'
            });

            var script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=G-WNRD89YC9C';
            document.head.appendChild(script);

            gtag('js', new Date());
            gtag('config', 'G-WNRD89YC9C', { anonymize_ip: true });
        }

        try {
            if (localStorage.getItem('calv_cookie_consent') === 'accepted') {
                loadAnalytics();
            }
        } catch (error) {
            // If browser storage is unavailable, analytics remains disabled.
        }
    </script>
    <script>
        (function (location) {
            if (location.search.charAt(1) !== '/') return;

            var route = location.search.slice(1).split('&').map(function (part) {
                return part.replace(/~and~/g, '&');
            });

            window.history.replaceState(
                null,
                '',
                location.pathname.slice(0, -1) + route[0] +
                (route[1] ? '?' + route.slice(1).join('&') : '') +
                location.hash
            );
        }(window.location));
    </script>
    <style>
        .cookie-consent {
            position: fixed;
            z-index: 9999;
            left: 50%;
            bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: min(1420px, calc(100vw - 32px));
            padding: 10px 12px 10px 28px;
            border: 1px solid #e5e5e5;
            border-radius: 999px;
            background: #fff;
            color: #000;
            font-family: "Space Mono", monospace;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .12);
            transform: translateX(-50%);
        }

        .cookie-consent[hidden], .cookie-settings[hidden] { display: none; }
        .cookie-consent__copy { flex: 1; margin: 0; color: #777; font-size: clamp(13px, 1.4vw, 21px); line-height: 1.3; }
        .cookie-consent__details { position: relative; flex: 0 0 auto; }
        .cookie-consent__details summary {
            min-width: 190px;
            padding: 15px 24px;
            border: 1.5px solid #111;
            border-radius: 999px;
            font-size: 13px;
            text-align: center;
            list-style: none;
            cursor: pointer;
        }
        .cookie-consent__details summary::-webkit-details-marker { display: none; }
        .cookie-consent__panel {
            position: absolute;
            right: 0;
            bottom: calc(100% + 18px);
            width: min(380px, calc(100vw - 48px));
            padding: 18px;
            border: 1.5px solid #111;
            border-radius: 20px;
            background: #fff;
            font-size: 11px;
            line-height: 1.55;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .12);
        }
        .cookie-consent__panel p { margin: 0; }
        .cookie-consent__actions { display: flex; gap: 10px; }
        .cookie-consent button, .cookie-settings {
            min-height: 52px;
            padding: 12px 24px;
            border: 1.5px solid #111;
            border-radius: 999px;
            background: #fff;
            color: #000;
            font: 400 13px/1.2 "Space Mono", monospace;
            text-transform: uppercase;
            cursor: pointer;
        }
        .cookie-consent #cookie-accept { min-width: 150px; background: #111; color: #fff; }
        .cookie-consent button:hover, .cookie-consent button:focus-visible,
        .cookie-settings:hover, .cookie-settings:focus-visible {
            background: #000;
            color: #fff;
            outline: none;
        }
        .cookie-settings {
            position: fixed;
            z-index: 9998;
            left: 16px;
            bottom: 16px;
            min-height: 36px;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 10px;
        }

        @media (max-width: 900px) {
            .cookie-consent { align-items: stretch; flex-direction: column; padding: 18px; border-radius: 24px; }
            .cookie-consent__copy { padding: 2px 4px 8px; font-size: 14px; text-align: center; }
            .cookie-consent__details summary { width: 100%; box-sizing: border-box; }
            .cookie-consent__panel { position: static; width: auto; margin-top: 10px; box-shadow: none; }
            .cookie-consent__actions { display: grid; grid-template-columns: 1fr 1fr; }
            .cookie-consent button { width: 100%; }
        }
    </style>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <section class="cookie-consent" id="cookie-consent" role="dialog" aria-modal="true" aria-label="Cookie preferences" hidden>
        <p class="cookie-consent__copy">We use analytics cookies to improve this site.</p>
        <details class="cookie-consent__details">
            <summary>Cookie settings</summary>
            <div class="cookie-consent__panel">
                <p>
                    Google Analytics measures visited pages, visit duration, device and approximate location.
                    We do not use this data for advertising. You can change your choice at any time.
                </p>
            </div>
        </details>
        <div class="cookie-consent__actions">
            <button type="button" id="cookie-reject">Reject</button>
            <button type="button" id="cookie-accept">Accept</button>
        </div>
    </section>
    <button class="cookie-settings" id="cookie-settings" type="button" hidden>Cookies</button>
    <script>
        (function () {
            var banner = document.getElementById('cookie-consent');
            var settings = document.getElementById('cookie-settings');
            var accept = document.getElementById('cookie-accept');
            var reject = document.getElementById('cookie-reject');

            function getChoice() {
                try { return localStorage.getItem('calv_cookie_consent'); }
                catch (error) { return null; }
            }

            function saveChoice(choice) {
                try { localStorage.setItem('calv_cookie_consent', choice); }
                catch (error) { /* Preference cannot be persisted. */ }
            }

            function deleteAnalyticsCookies() {
                document.cookie.split(';').forEach(function (cookie) {
                    var name = cookie.split('=')[0].trim();
                    if (name === '_ga' || name.indexOf('_ga_') === 0) {
                        document.cookie = name + '=; Max-Age=0; path=/; SameSite=Lax';
                        document.cookie = name + '=; Max-Age=0; path=/calv_heetos/; SameSite=Lax';
                    }
                });
            }

            function showBanner() {
                banner.hidden = false;
                settings.hidden = true;
                reject.focus();
            }

            function hideBanner() {
                banner.hidden = true;
                settings.hidden = getChoice() === 'accepted';
            }

            accept.addEventListener('click', function () {
                saveChoice('accepted');
                loadAnalytics();
                hideBanner();
            });

            reject.addEventListener('click', function () {
                var wasAccepted = getChoice() === 'accepted';
                saveChoice('rejected');
                deleteAnalyticsCookies();
                hideBanner();

                if (wasAccepted) window.location.reload();
            });

            settings.addEventListener('click', showBanner);

            if (getChoice()) hideBanner();
            else showBanner();
        }());
    </script>
</body>

</html>
